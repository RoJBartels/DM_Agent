[project]
name = "dm-agent"
version = "0.1.0"
description = "AI Dungeon Master: the LLM narrates, code adjudicates."
readme = "README.md"
authors = [
    { name = "RoJBartels", email = "robinjens.bartels@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# Knowledge layer (M2+): embeddings + graph clustering. Heavy — install when needed.
# sentence-transformers pulls in torch (~large); the rest are small. Embeddings are
# behind an interface so code imports and tests run without torch present.
knowledge = [
    "sentence-transformers>=3.3",
    "networkx>=3.4",
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[project.scripts]
dm-agent = "dm_agent.main:run"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session so the module-level async engine singleton
# (db/engine.py) isn't reused across loops — the DB-backed tests share it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
