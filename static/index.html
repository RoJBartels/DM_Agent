<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM Agent — Stage</title>
<style>
  :root {
    --bg: #14120f;
    --panel: #1d1a15;
    --panel2: #232019;
    --text: #e8e0cf;
    --dim: #9a917c;
    --line: #2c2820;
    --line2: #3a3428;
    --accent: #c9a227;
    --danger: #c05b4d;
    --good: #6faf6a;
    --bad: #c86a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 0.6rem 1.2rem; border-bottom: 1px solid var(--line);
    font-variant: small-caps; letter-spacing: 0.15em; color: var(--dim);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  #status { font-size: 0.8rem; letter-spacing: normal; font-variant: normal; }

  /* Layout: sidebar + stage */
  #app { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 17rem; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto;
    padding: 1rem 0.9rem; display: flex; flex-direction: column; gap: 1.4rem;
  }
  #sidebar.collapsed { display: none; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .side-section h2 {
    font-size: 0.72rem; font-variant: small-caps; letter-spacing: 0.14em;
    color: var(--dim); margin: 0 0 0.5rem; font-weight: normal;
  }
  .row { display: flex; gap: 0.4rem; align-items: center; }
  .party-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.4rem 0.55rem; border: 1px solid var(--line2); border-radius: 0.4rem;
    margin-bottom: 0.4rem; cursor: pointer; background: var(--panel2);
  }
  .party-item:hover { border-color: var(--accent); }
  .party-item .pname { font-size: 0.95rem; }
  .party-item .pmeta { font-size: 0.72rem; color: var(--dim); }
  .party-item .hp { font-family: ui-monospace, monospace; font-size: 0.72rem; color: var(--dim); }
  .muted { color: var(--dim); font-size: 0.8rem; }

  #log {
    flex: 1; overflow-y: auto; padding: 1.5rem clamp(1rem, 8vw, 6rem);
    line-height: 1.65; font-size: 1.05rem;
  }
  .dm { white-space: pre-wrap; margin: 0 0 1.1rem; }
  .player { color: var(--accent); font-style: italic; margin: 0 0 1.1rem; }
  .player::before { content: "➤ "; }
  .chip {
    display: inline-block; background: var(--panel); border: 1px solid var(--line2);
    border-radius: 0.6rem; padding: 0.1rem 0.55rem; margin: 0 0.15rem;
    font-family: ui-monospace, monospace; font-size: 0.85rem; color: var(--accent);
  }
  /* Legible dice chip (M2h): distinguish the die faces, the modifier, and the verdict. */
  .chip.dice { color: var(--text); }
  .chip .d-label { color: var(--dim); }
  .chip .d-note { color: var(--dim); }
  .chip .d-mod { color: var(--accent); }
  .chip .dropped { text-decoration: line-through; opacity: 0.5; }
  .chip .d-out { font-weight: bold; }
  .chip .d-out.good { color: var(--good); }
  .chip .d-out.bad { color: var(--bad); }
  .chip .d-out.crit-good { color: var(--accent); text-shadow: 0 0 6px rgba(201,162,39,0.5); }
  .chip .d-out.crit-bad { color: var(--danger); font-weight: bold; }
  /* Screened roll (M2l): present but deliberately illegible — no numbers to read. */
  .chip.hidden-roll { border-style: dashed; opacity: 0.75; font-style: italic; }
  .mod-src {
    display: block; color: var(--dim); font-size: 0.74rem;
    font-family: ui-monospace, monospace; margin: 0.2rem 0 0 1.6rem;
  }
  .notice {
    color: var(--dim); font-size: 0.85rem; font-family: ui-monospace, monospace;
    margin: 0 0 1.1rem;
  }
  .error { color: var(--danger); }

  form#form {
    display: flex; gap: 0.6rem; padding: 0.9rem 1.2rem;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  input[type=text], input[type=number], textarea, select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line2); border-radius: 0.4rem;
    padding: 0.5rem 0.7rem; font-size: 0.95rem; font-family: inherit; width: 100%;
  }
  form#form input[type=text] { flex: 1; }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); }
  textarea { resize: vertical; min-height: 4rem; }
  button {
    background: var(--accent); color: #1a1815; border: 0; border-radius: 0.4rem;
    padding: 0.5rem 1rem; font-size: 0.95rem; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: 0.4; cursor: wait; }
  button.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--line2);
  }
  button.ghost:hover { border-color: var(--accent); }
  button.danger { background: var(--danger); color: #fff; }
  button.small { padding: 0.3rem 0.6rem; font-size: 0.82rem; }

  /* Modal */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #overlay.open { display: flex; }
  #modal {
    background: var(--panel); border: 1px solid var(--line2); border-radius: 0.6rem;
    width: min(38rem, 92vw); max-height: 88vh; overflow-y: auto; padding: 1.4rem 1.5rem;
  }
  #modal h2 { margin: 0 0 1rem; font-variant: small-caps; letter-spacing: 0.08em; }
  .field { margin-bottom: 0.85rem; }
  .field label { display: block; font-size: 0.78rem; color: var(--dim); margin-bottom: 0.25rem; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; }
  .abil { text-align: center; }
  .abil label { text-align: center; }
  .abil-mod {
    display: block; margin-top: 0.2rem; font-family: ui-monospace, monospace;
    font-size: 0.78rem; color: var(--accent);
  }
  .abil-tools { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
  /* Point buy (M2j): budget spent and legal range are two separate readouts,
     both always visible — the old single label flipped between them. */
  .abil-tools .pb { margin-left: auto; text-align: right; line-height: 1.3; }
  .pb > span { display: block; }
  #pb-spent { font-size: 0.8rem; color: var(--dim); }
  #pb-spent.over { color: var(--danger); }
  #pb-range { font-size: 0.72rem; }

  /* Skill proficiencies (M2j) */
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
  .skills { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.1rem 0.9rem; }
  .skill { display: flex; align-items: center; gap: 0.35rem; }
  .skill input[type=checkbox] { width: auto; margin: 0; flex-shrink: 0; }
  .skill label { display: inline; margin: 0; font-size: 0.84rem; color: var(--text); cursor: pointer; }
  .skill .sk-abil { color: var(--dim); font-size: 0.68rem; }
  .skill.eligible > label { color: var(--accent); }
  .skill .sk-mod {
    margin-left: auto; font-family: ui-monospace, monospace;
    font-size: 0.76rem; color: var(--dim);
  }
  .skill .sk-mod.trained { color: var(--accent); }
  .skill .sk-exp-label { font-size: 0.66rem; color: var(--dim); }
  .skill input.sk-exp:disabled, .skill input.sk-exp:disabled + label { opacity: 0.3; }
  #sk-hint { margin-top: 0.45rem; }

  /* Click-to-add spell suggestions (M2j) */
  .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-top: 0.4rem; }
  button.chip-add {
    background: transparent; border: 1px solid var(--line2); color: var(--dim);
    padding: 0.1rem 0.45rem; font-size: 0.74rem; border-radius: 0.9rem;
  }
  button.chip-add:hover { color: var(--accent); border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.1rem; }
  .checkbox { display: flex; align-items: center; gap: 0.4rem; }
  .checkbox input { width: auto; }
  #job-status { margin-top: 0.8rem; font-family: ui-monospace, monospace; font-size: 0.85rem; }

  /* Actor selector (M2e) — sits at the head of the action bar */
  #actor { width: auto; max-width: 11rem; flex-shrink: 0; }

  /* Start menu (M2d) */
  #start-screen {
    position: fixed; inset: 0; z-index: 5; background: var(--bg);
    display: none; align-items: flex-start; justify-content: center;
    overflow-y: auto; padding: clamp(1.5rem, 8vh, 5rem) 1rem;
  }
  #start-screen.open { display: flex; }
  .start-card {
    width: min(34rem, 94vw); background: var(--panel);
    border: 1px solid var(--line2); border-radius: 0.7rem; padding: 1.8rem 1.9rem;
  }
  .start-card h1 {
    margin: 0 0 0.3rem; font-variant: small-caps; letter-spacing: 0.12em;
    color: var(--accent); font-weight: normal;
  }
  .start-section { margin-top: 1.6rem; }
  .start-section h2, .start-detail h2 {
    font-size: 0.72rem; font-variant: small-caps; letter-spacing: 0.14em;
    color: var(--dim); margin: 0 0 0.6rem; font-weight: normal;
  }
  .start-campaign {
    display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
    padding: 0.6rem 0.7rem; border: 1px solid var(--line2); border-radius: 0.5rem;
    margin-bottom: 0.45rem; cursor: pointer; background: var(--panel2);
  }
  .start-campaign:hover { border-color: var(--accent); }
  .start-campaign.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .start-campaign .sc-name { font-size: 1rem; }
  .start-campaign .sc-meta { font-size: 0.72rem; color: var(--dim); text-align: right; }
  .start-detail { margin-top: 1.6rem; }
  .start-detail .roster { margin: 0.2rem 0 0.8rem; }
  .start-detail .roster .rname { display: inline-block; margin: 0 0.5rem 0.35rem 0;
    padding: 0.15rem 0.5rem; border: 1px solid var(--line2); border-radius: 0.4rem;
    font-size: 0.82rem; cursor: pointer; }
  .start-detail .roster .rname:hover { border-color: var(--accent); }
  .start-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  /* Catch-up recap (M2k) — the "previously, on…" before you sit back down. */
  .recap { margin: 0.9rem 0 0; }
  .recap-text {
    margin-top: 0.6rem; padding: 0.7rem 0.85rem; border-left: 2px solid var(--accent);
    background: rgba(255, 255, 255, 0.03); border-radius: 0 0.4rem 0.4rem 0;
    font-size: 0.86rem; line-height: 1.55; font-style: italic; white-space: pre-wrap;
  }
  .recap-text.muted { font-style: normal; }
  .setting {
    display: flex; gap: 0.5rem; align-items: flex-start; margin-top: 1rem;
    font-size: 0.86rem; cursor: pointer;
  }
  .setting input { width: auto; margin-top: 0.2rem; flex-shrink: 0; }
  .setting .muted { display: block; font-size: 0.76rem; margin-top: 0.15rem; }
  #start-play {
    margin-top: 1.8rem; width: 100%; padding: 0.7rem; font-size: 1.05rem;
    font-variant: small-caps; letter-spacing: 0.08em;
  }

  /* --- Worlds (M2i) --------------------------------------------------------
     A world card reads like a campaign card but sits above it, so the visual
     hierarchy matches the real one: choose the setting, then the playthrough. */
  .start-world {
    display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
    padding: 0.6rem 0.7rem; border: 1px solid var(--line2); border-radius: 0.5rem;
    margin-bottom: 0.45rem; cursor: pointer; background: var(--panel2);
  }
  .start-world:hover { border-color: var(--accent); }
  .start-world.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .start-world .sw-name { font-size: 1rem; }
  .start-world .sw-meta { font-size: 0.72rem; color: var(--dim); text-align: right; }
  .world-desc { font-size: 0.84rem; color: var(--dim); margin: 0 0 0.7rem; }
  .danger { border-color: #7a3b3b; color: #d99; }
  .danger:hover { border-color: #b55; color: #f2b0b0; }

  /* Content studio lists (lore entities, story beats) */
  .studio-list { margin: 0.4rem 0 0; max-height: 46vh; overflow-y: auto; }
  .studio-row {
    display: flex; align-items: baseline; gap: 0.5rem; padding: 0.4rem 0.2rem;
    border-bottom: 1px solid var(--line2); font-size: 0.86rem;
  }
  .studio-row .sr-type {
    font-size: 0.68rem; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.06em; min-width: 5.5rem; flex-shrink: 0;
  }
  .studio-row .sr-name { flex: 1; }
  .studio-row .sr-sub { color: var(--dim); font-size: 0.76rem; }
  .studio-row button { padding: 0.1rem 0.4rem; font-size: 0.72rem; }

  /* --- Knowledge-graph explorer (M2i) ------------------------------------- */
  #graph-screen {
    position: fixed; inset: 0; z-index: 7; background: var(--bg);
    display: none; flex-direction: column;
  }
  #graph-screen.open { display: flex; }
  .graph-bar {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--line2); background: var(--panel);
  }
  .graph-spacer { flex: 1; }
  .graph-types { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .graph-types button {
    padding: 0.15rem 0.5rem; font-size: 0.74rem; border-radius: 1rem;
    background: transparent; border: 1px solid var(--line2); color: var(--dim);
  }
  .graph-types button.on { border-color: var(--accent); color: var(--fg); }
  .graph-body { flex: 1; display: flex; min-height: 0; }
  #graph-svg { flex: 1; cursor: grab; touch-action: none; }
  #graph-svg:active { cursor: grabbing; }
  #graph-svg .edge { stroke: var(--line2); stroke-width: 1; }
  #graph-svg .edge.lit { stroke: var(--accent); stroke-width: 1.6; }
  #graph-svg .node circle { stroke: var(--bg); stroke-width: 1.5; cursor: pointer; }
  #graph-svg .node.sel circle { stroke: var(--fg); stroke-width: 2.5; }
  #graph-svg .node text { font-size: 13px; fill: var(--fg); pointer-events: none; }
  #graph-svg .node.sel text { fill: var(--accent); }
  #graph-svg .elabel { font-size: 10px; fill: var(--dim); pointer-events: none; }
  .graph-inspect {
    width: min(22rem, 40vw); border-left: 1px solid var(--line2); background: var(--panel);
    padding: 1rem; overflow-y: auto; font-size: 0.86rem;
  }
  .graph-inspect h3 { margin: 0 0 0.2rem; font-size: 1rem; }
  .graph-inspect .gi-type { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.08em;
    text-transform: uppercase; }
  .graph-inspect .gi-prose { margin: 0.7rem 0; line-height: 1.55; white-space: pre-wrap; }
  .graph-inspect .gi-links { margin-top: 0.6rem; }
  .graph-inspect .gi-link { display: block; padding: 0.2rem 0; color: var(--dim);
    font-size: 0.8rem; cursor: pointer; }
  .graph-inspect .gi-link:hover { color: var(--accent); }
  .graph-inspect textarea { min-height: 8rem; }
</style>
</head>
<body>
  <header>
    <span class="row" style="gap:0.8rem">
      <button id="toggle-sidebar" class="ghost small" title="Toggle sidebar">☰</button>
      <button id="home" class="ghost small" title="Back to start menu">⌂</button>
      <span>Dungeon Master</span>
    </span>
    <span id="status">connecting…</span>
  </header>

  <div id="app">
    <aside id="sidebar">
      <div class="side-section">
        <h2>World</h2>
        <div id="world-name" class="muted">—</div>
      </div>

      <div class="side-section">
        <h2>Campaign</h2>
        <div class="field"><select id="campaign-select"></select></div>
        <button id="new-campaign" class="ghost small">＋ New campaign</button>
      </div>

      <div class="side-section">
        <h2>Party</h2>
        <div id="party"></div>
        <button id="add-character" class="ghost small">＋ Add character</button>
      </div>

      <div class="side-section">
        <h2>World lore</h2>
        <div id="world-status" class="muted">—</div>
        <div class="row" style="gap:0.4rem; margin-top:0.5rem">
          <button id="upload-world" class="ghost small">⇪ Upload lore</button>
          <button id="explore-world" class="ghost small">🕸 Explore</button>
        </div>
      </div>

      <div class="side-section">
        <h2>Story guide</h2>
        <div id="story-status" class="muted">—</div>
        <button id="upload-story" class="ghost small" style="margin-top:0.5rem">⇪ Upload adventure</button>
      </div>
    </aside>

    <div id="stage">
      <div id="log"></div>
      <form id="form">
        <select id="actor" title="Who is acting?" hidden></select>
        <input id="input" type="text" autocomplete="off"
               placeholder="What do you do?" disabled>
        <button id="send" type="submit" disabled>Act</button>
      </form>
    </div>
  </div>

  <!-- Start menu (M2d): shown on load; play connects only when chosen.
       M2i put worlds above campaigns — the world you pick decides which
       campaigns, characters and stories exist below it. -->
  <div id="start-screen">
    <div class="start-card">
      <h1>Dungeon Master</h1>
      <p class="muted">Pick a world, choose a campaign, ready your party, then step in.</p>
      <div class="start-section">
        <h2>Worlds</h2>
        <div id="start-worlds"></div>
        <button id="start-new-world" class="ghost small">＋ New world</button>
      </div>
      <div id="start-world-detail" class="start-detail"></div>
      <div class="start-section">
        <h2>Campaigns</h2>
        <div id="start-campaigns"></div>
        <button id="start-new-campaign" class="ghost small">＋ New campaign</button>
      </div>
      <div id="start-detail" class="start-detail"></div>
      <button id="start-play" disabled>▶ Enter play</button>
    </div>
  </div>

  <!-- Knowledge-graph explorer (M2i): the world's canon, laid out client-side. -->
  <div id="graph-screen">
    <div class="graph-bar">
      <strong id="graph-title">World</strong>
      <span id="graph-types" class="graph-types"></span>
      <span class="graph-spacer"></span>
      <span id="graph-count" class="muted"></span>
      <button id="graph-close" class="ghost small">✕ Close</button>
    </div>
    <div class="graph-body">
      <svg id="graph-svg"></svg>
      <div id="graph-inspect" class="graph-inspect"></div>
    </div>
  </div>

  <div id="overlay"><div id="modal"></div></div>

  <script src="/static/stage.js"></script>
  <script src="/static/graph.js"></script>
  <script src="/static/manage.js"></script>
</body>
</html>
