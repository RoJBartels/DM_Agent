services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: dm
      POSTGRES_DB: dm_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d dm_agent"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
