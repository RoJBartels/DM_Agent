services:
  db:
    image: pgvector/pgvector:pg17
    # Come back automatically after a host reboot / Docker daemon restart, so the
    # app isn't left with a refused DB connection. `unless-stopped` won't override
    # a container you deliberately `docker compose stop`.
    restart: unless-stopped
    environment:
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: dm
      POSTGRES_DB: dm_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d dm_agent"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
